name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  document-pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: components/document-intake-extraction-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ruff==0.16.9 -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
